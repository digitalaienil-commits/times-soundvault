name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: soundvault
          POSTGRES_USER: soundvault
          POSTGRES_PASSWORD: soundvault_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soundvault -d soundvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_PROVIDER: google
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-32-characters
      BETTER_AUTH_URL: https://soundvault.test
      AUTH_TRUSTED_ORIGINS: https://soundvault.test
      DATABASE_URL: postgresql://soundvault:soundvault_ci_password@127.0.0.1:5432/soundvault
      TEST_DATABASE_URL: postgresql://soundvault:soundvault_ci_password@127.0.0.1:5432/soundvault
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_WORKSPACE_DOMAIN: soundvault.test
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT: ${{ runner.temp }}/soundvault-storage
      COPYRIGHT_PROVIDER: manual_youtube
      COPYRIGHT_TEMP_ROOT: ${{ runner.temp }}/soundvault-copyright
      LOCAL_ADMIN_NAME: CI Admin
      LOCAL_ADMIN_EMAIL: admin@soundvault.test
      LOCAL_ADMIN_PASSWORD: ci-admin-password-only
      LOCAL_PRODUCER_NAME: CI Producer
      LOCAL_PRODUCER_EMAIL: producer@soundvault.test
      LOCAL_PRODUCER_PASSWORD: ci-producer-password-only
      LOCAL_COORDINATOR_NAME: CI Coordinator
      LOCAL_COORDINATOR_EMAIL: coordinator@soundvault.test
      LOCAL_COORDINATOR_PASSWORD: ci-coordinator-password-only
      LOCAL_USER_NAME: CI User
      LOCAL_USER_EMAIL: user@soundvault.test
      LOCAL_USER_PASSWORD: ci-user-password-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Use project Node.js version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install audio processing tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Prepare empty authentication database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U soundvault -d soundvault -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS auth; ALTER ROLE soundvault SET search_path TO auth, public;"
          pnpm auth:migrate
          pnpm domain:migrate
          pnpm auth:seed-local

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration

      - name: Verify private storage and cleanup dry run
        run: |
          pnpm storage:verify
          pnpm uploads:cleanup
          pnpm processing:once
          pnpm processing:reconcile
          pnpm processing:cleanup
          pnpm copyright:status
          pnpm copyright:once
          pnpm copyright:reconcile
          pnpm copyright:cleanup

      - name: Build production application
        run: pnpm build

  browser:
    name: Chromium smoke and accessibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: soundvault
          POSTGRES_USER: soundvault
          POSTGRES_PASSWORD: soundvault_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soundvault -d soundvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_PROVIDER: local
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://soundvault:soundvault_ci_password@127.0.0.1:5432/soundvault
      LOCAL_ADMIN_NAME: Admin User
      LOCAL_ADMIN_EMAIL: admin@soundvault.test
      LOCAL_ADMIN_PASSWORD: local-admin-password-ci
      LOCAL_PRODUCER_NAME: Music Producer
      LOCAL_PRODUCER_EMAIL: producer@soundvault.test
      LOCAL_PRODUCER_PASSWORD: local-producer-password-ci
      LOCAL_COORDINATOR_NAME: Coordinator User
      LOCAL_COORDINATOR_EMAIL: coordinator@soundvault.test
      LOCAL_COORDINATOR_PASSWORD: local-coordinator-password-ci
      LOCAL_USER_NAME: Library User
      LOCAL_USER_EMAIL: user@soundvault.test
      LOCAL_USER_PASSWORD: local-user-password-ci
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT: ${{ runner.temp }}/soundvault-storage
      COPYRIGHT_PROVIDER: manual_youtube
      COPYRIGHT_TEMP_ROOT: ${{ runner.temp }}/soundvault-copyright
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Use project Node.js version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install audio processing tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Prepare and seed authentication database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U soundvault -d soundvault -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS auth; ALTER ROLE soundvault SET search_path TO auth, public;"
          pnpm auth:migrate
          pnpm domain:migrate
          pnpm auth:seed-local

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Clean temporary private storage
        if: always()
        run: rm -rf "$LOCAL_STORAGE_ROOT" "$COPYRIGHT_TEMP_ROOT"

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

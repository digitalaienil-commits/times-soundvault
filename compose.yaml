services:
  postgres:
    image: pgvector/pgvector:pg17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: soundvault
      POSTGRES_USER: soundvault
      POSTGRES_PASSWORD: soundvault_local
    ports:
      - "5432:5432"
    volumes:
      - soundvault-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundvault -d soundvault"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  soundvault-postgres:
